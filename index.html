<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><title>NooXMeteer</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <svg width="34" height="34" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><circle cx="14" cy="32" r="5" fill="url(#g)"/><g fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round"><path d="M26 20a17 17 0 0 1 0 24"/><path d="M36 12a29 29 0 0 1 0 40"/><path d="M46 5a40 40 0 0 1 0 54"/></g></svg>
  <h1>NooX<span>Meteer</span> <small>v1.3</small></h1>
</header>
<main>
  <button id="power"><b id="pt">BAŞLAT</b><small id="ps">Ses tüm seçili cihazlara gidecek</small></button>
  <div id="cap"><small>Yakalanan sistem sesi</small><div class="bar"><i></i></div></div>
  <h2>Çıkış Cihazları <em id="count"></em></h2>
  <div id="devs"></div>
  <h2>Mikrofon</h2>

    <select id="mic"></select>
    <button id="mute" title="Sustur">🎤</button></div>
    <div id="meter"><i></i></div><small id="mstat">Seviye göstergesi</small></div>
  <p class="hint">İpucu: Windows’taki varsayılan hoparlör zaten çalar; diğerlerini buradan açman yeterli.</p>
</main>
<footer>Developed by <b>NooXRii</b></footer>
